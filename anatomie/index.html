let currentQuiz = [];
let currentQuestion = 0;
let correctAnswers = 0;

let wrongAnswers =
  JSON.parse(localStorage.getItem('wrongAnswers')) || [];

let wrongAnswers40 =
  JSON.parse(localStorage.getItem('wrongAnswers40')) || [];

function shuffleArray(array) {

  for (let i = array.length - 1; i > 0; i--) {

    const j = Math.floor(Math.random() * (i + 1));

    [array[i], array[j]] = [array[j], array[i]];
  }

  return array;
}

function startQuiz(type) {

  document.getElementById('quiz')
    .classList.remove('hidden');

  document.getElementById('result').innerText = '';

  if (type === 'all') {

    currentQuiz =
      shuffleArray([...questions]);
  }

  if (type === 'wrong') {

    currentQuiz =
      shuffleArray(
        questions.filter(q =>
          wrongAnswers.includes(q.question)
        )
      );

    if (currentQuiz.length === 0) {

      alert('Nemáš žádné špatné otázky.');

      return;
    }
  }

  if (type === '40') {

    currentQuiz =
      shuffleArray([...questions]).slice(0, 40);
  }

  if (type === '40wrong') {

    currentQuiz =
      shuffleArray(
        questions.filter(q =>
          wrongAnswers40.includes(q.question)
        )
      );

    if (currentQuiz.length === 0) {

      alert(
        'Nemáš žádné špatné otázky z testu 40 otázek.'
      );

      return;
    }
  }

  currentQuestion = 0;
  correctAnswers = 0;

  showQuestion(type);
}

function showQuestion(mode) {

  const q = currentQuiz[currentQuestion];

  document.getElementById('progress').innerText =
    `Otázka ${currentQuestion + 1} / ${currentQuiz.length}`;

  document.getElementById('question').innerText =
    q.question;

  const answersDiv =
    document.getElementById('answers');

  answersDiv.innerHTML = '';

  q.answers.forEach((answer, index) => {

    const btn =
      document.createElement('button');

    btn.classList.add('answer-btn');

    btn.innerText =
      `${String.fromCharCode(65 + index)}: ${answer}`;

    btn.onclick = () =>
      checkAnswer(
        index,
        q.correct,
        btn,
        mode,
        q.question
      );

    answersDiv.appendChild(btn);
  });
}

function checkAnswer(
  selected,
  correct,
  button,
  mode,
  questionText
) {

  const buttons =
    document.querySelectorAll('.answer-btn');

  buttons.forEach(btn => btn.disabled = true);

  if (selected === correct) {

    correctAnswers++;

    button.classList.add('correct');

  } else {

    button.classList.add('wrong');

    buttons[correct].classList.add('correct');

    if (!wrongAnswers.includes(questionText)) {

      wrongAnswers.push(questionText);
    }

    if (
      mode === '40' &&
      !wrongAnswers40.includes(questionText)
    ) {

      wrongAnswers40.push(questionText);
    }
  }

  localStorage.setItem(
    'wrongAnswers',
    JSON.stringify(wrongAnswers)
  );

  localStorage.setItem(
    'wrongAnswers40',
    JSON.stringify(wrongAnswers40)
  );

  const nextBtn =
    document.createElement('button');

  nextBtn.innerText = 'Další otázka';

  nextBtn.classList.add('start-btn');

  nextBtn.style.marginTop = '20px';

  nextBtn.onclick = () => {

    currentQuestion++;

    if (currentQuestion < currentQuiz.length) {

      showQuestion(mode);

    } else {

      finishQuiz();
    }
  };

  document.getElementById('answers')
    .appendChild(nextBtn);
}

function finishQuiz() {

  const total = currentQuiz.length;

  const percent =
    Math.round(
      (correctAnswers / total) * 100
    );

  document.getElementById('question').innerText =
    'Test dokončen!';

  document.getElementById('answers').innerHTML = '';

  document.getElementById('progress').innerText = '';

  document.getElementById('result').innerHTML = `
    Správně: ${correctAnswers} / ${total}<br>
    Úspěšnost: ${percent} %
  `;
}

function finishQuizEarly() {

  finishQuiz();
}
